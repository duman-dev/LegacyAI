name: Build iOS IPA
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode Project
        run: xcodegen generate
      - name: Build App
        run: |
          xcodebuild -project LegacyAI.xcodeproj -scheme LegacyAI -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/LegacyAI.app Payload/
          zip -r LegacyAI.ipa Payload
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LegacyAI-IPA
          path: LegacyAI.ipa
