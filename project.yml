name: Build iOS IPA
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Locate project.yml
        run: |
          echo "Dosyalar taranıyor:"
          find . -name "project.yml"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          PROJECT_DIR=$(dirname $(find . -name "project.yml" | head -n 1))
          echo "Proje dizini bulundu: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          xcodegen generate

      - name: Build App
        run: |
          PROJECT_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          PROJECT_DIR=$(dirname "$PROJECT_PATH")
          echo "Xcode projesi bulundu: $PROJECT_PATH"
          cd "$PROJECT_DIR"
          xcodebuild -project LegacyAI.xcodeproj -scheme LegacyAI -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find . -name "LegacyAI.app" -type d | grep -v "Index" | head -n 1)
          echo "App bulundu: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r LegacyAI.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LegacyAI-IPA
          path: LegacyAI.ipa
